name: Swiitch
options:
  bundleIdPrefix: com.swiitch
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

# Project-wide signing values live in Config/Signing.xcconfig. That file
# `#include?`s an optional Config/Signing.local.xcconfig (gitignored) so each
# contributor can plug in their own Apple Development cert for stable TCC.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    PRODUCT_NAME: Swiitch
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: NO

targets:
  Swiitch:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - path: Swiitch
        excludes:
          - "Resources/Info.plist"
      - path: Swiitch/Resources/Info.plist
        buildPhase: none
    resources:
      - Swiitch/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiitch.Swiitch
        INFOPLIST_FILE: Swiitch/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
