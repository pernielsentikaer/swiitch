name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # CI builds with ad-hoc signing — no Apple Developer credentials needed.
      # Contributors who want stable TCC on their own machine override via
      # Config/Signing.local.xcconfig (gitignored).
      - name: Build and test (Debug)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project Swiitch.xcodeproj \
            -scheme Swiitch \
            -configuration Debug \
            -destination 'platform=macOS' \
            -resultBundlePath build/DebugTests.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_STYLE=Automatic \
            test | xcpretty

      - name: Universal Release compilation
        run: |
          set -o pipefail
          xcodebuild -project Swiitch.xcodeproj -scheme Swiitch -configuration Release \
            -derivedDataPath build/Universal -onlyUsePackageVersionsFromResolvedFile \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= build | xcpretty
          swiitch_built_archs="$(lipo -archs build/Universal/Build/Products/Release/Swiitch.app/Contents/MacOS/Swiitch)"
          for swiitch_required_arch in arm64 x86_64; do
            if [[ " $swiitch_built_archs " != *" $swiitch_required_arch "* ]]; then
              echo "::error::Missing $swiitch_required_arch (built: $swiitch_built_archs)"
              exit 1
            fi
          done

      - name: Verify dependency lock and release gates
        run: |
          cmp Package.resolved Swiitch.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          bash Scripts/test_release_gates.sh

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/DebugTests.xcresult
          if-no-files-found: warn
